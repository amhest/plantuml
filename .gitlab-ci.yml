release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_MANUAL_RELEASE == "true"
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH && $CI_PIPELINE_SOURCE == "push"
  tags:
    - gitlab-org-docker
  script:
    - echo 'Release v${VERSION}'
  release:
    name: 'Release v${VERSION}'
    tag_name: '${VERSION}'
    ref: '$CI_COMMIT_SHA'
    description: 'Release v${VERSION}'

upload-release-jfrog:
  stage: deploy
  image:
    name: $BUILD_ENV_PYTHON_LATEST_IMAGE
    pull_policy: if-not-present
  tags: 
    - linux
    - docker-runner
  rules:
    - if: $CI_MANUAL_RELEASE == "true"
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH && $CI_PIPELINE_SOURCE == "push"
  needs: ["release"]
  script:
    - jf c add synchron-jfrog
      --interactive=false
      --url=https://synchron.jfrog.io
      --access-token=$JFROG_ACCESS_TOKEN
    - python3 -m venv venv
    - source venv/bin/activate
    - jf pipc --server-id-resolve synchron-jfrog --repo-resolve pypi-dev
    - jf pip install --force-reinstall build
    - jf pip install .
      --force-reinstall
      --build-name=$CI_PROJECT_NAME
      --build-number=$CI_PIPELINE_IID
    - python -m build
    - jf rt u dist/ $JFROG_UPLOAD_PATH --build-name=$CI_PROJECT_NAME --build-number=$CI_PIPELINE_IID --flat=true
    - jf rt bce $CI_PROJECT_NAME $CI_PIPELINE_IID
    - jf rt bag $CI_PROJECT_NAME $CI_PIPELINE_IID
    - jf rt bp $CI_PROJECT_NAME $CI_PIPELINE_IID --env-include=CI_JOB_URL
