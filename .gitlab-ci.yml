image: "python:3.7"

variables:
  RELEASE_BRANCH: synchron-main
  VERSION_MAJOR: "0"
  VERSION_MINOR: "0"
  VERSION_PATCH: "18"
  VERSION_BUILD: "${CI_PIPELINE_IID}"
  VERSION: "${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}+${VERSION_BUILD}"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  PIP_INDEX_URL: "https://${JFROG_USERNAME}:${JFROG_ACCESS_TOKEN}@synchron.jfrog.io/artifactory/api/pypi/pypi-dev/simple"
  # SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  JFROG_UPLOAD_PATH: "pypi-dev-local/synchron.sphinxcontrib-plantuml/${VERSION}/"


workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

